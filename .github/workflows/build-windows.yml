name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Syndesk-Host-Setup
          path: dist/Syndesk-Host-Setup.exe
          if-no-files-found: error

      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: Syndesk Host v0.6.0
          body: Adds experimental 90 and 120 FPS streaming plus the new mobile pointer, scroll, typing, and multitouch game control modes.
          files: dist/Syndesk-Host-Setup.exe
          fail_on_unmatched_files: true
